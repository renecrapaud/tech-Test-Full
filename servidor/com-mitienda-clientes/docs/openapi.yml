openapi: 3.0.3
info:
  title: API de Administración de Clientes
  version: 1.0.0
  description: Servicio API que proporciona los métodos de creación, consulta, actualiación y eliminación de clientes en MongoDB.

servers:
  - url: http://localhost:8080/api
    description: Servidor local

paths:
  /clientes:
    get:
      summary: Listar clientes
      description: Obtiene todos los clientes encontrados en la base de datos.
      tags:
        - Clientes
      responses:
        '200':
          description: Lista de clientes obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cliente'
        '404':
          description: Datos no encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRes'
    post:
      summary: Registrar un nuevo cliente
      tags:
        - Clientes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteRequest'
      responses:
        '201':
          description: Cliente creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryErrorRes'
        '404':
          description: Datos no encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRes'

  /clientes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador único del cliente
        schema:
          type: string
        example: "CLI-001"

    get:
      summary: Obtener un cliente por ID
      tags:
        - Clientes
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '404':
          description: Cliente no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRes'

    put:
      summary: Actualizar datos de un cliente
      tags:
        - Clientes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteRequest'
      responses:
        '200':
          description: Cliente actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '404':
          description: Cliente no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRes'

components:
  schemas:
    ClienteRequest:
      type: object
      required:
        - nombre
        - apellidoPat
        - correoElectronico
      properties:
        nombre:
          type: string
          example: "Ana"
        apellidoPat:
          type: string
          example: "López"
        apellidoMat:
          type: string
          nullable: true
          example: "Ramírez"
        correoElectronico:
          type: string
          format: email
          example: "ana.lopez@ejemplo.com"

    Cliente:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: string
              example: "CLI-001"
        - $ref: '#/components/schemas/ClienteRequest'

    NotFoundErrorRes:
      type: object
      required:
        - codigo
        - mensaje
      properties:
        codigo:
          type: string
          example: "CLIENTE_NO_ENCONTRADO"
        mensaje:
          type: string
          example: "No existe un cliente con el identificador proporcionado."

    EntryErrorRes:
      type: object
      required:
        - codigo
        - mensaje
      properties:
        codigo:
          type: string
          example: "Datos de entrada invalidos"
        mensaje:
          type: string
          example: "Los datos proporcionados no devolvieron resultados."
